<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>猫狗全科诊疗系统（DeepSeek AI版）</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,Arial;}
  body{background:#fff5f8;padding:10px;}
  .wrap{max-width:900px;margin:0 auto;background:#fff;border-radius:16px;overflow:hidden;}
  .head{background:#ffb6c1;padding:16px;text-align:center;}
  .head h1{font-size:18px;color:#800033;}
  .nav{display:flex;background:#fff8fa;flex-wrap:wrap;}
  .nav span{flex:1;padding:12px;text-align:center;font-size:13px;cursor:pointer;}
  .nav span.on{background:#fff;color:#a0003c;border-bottom:2px solid #e64980;font-weight:600;}
  .page{padding:18px;display:none;}
  .page.show{display:block;}
  .sub-page{padding:18px;display:none;}
  .sub-page.show{display:block;}
  .tit{font-size:16px;color:#a0003c;margin:10px 0 12px;border-bottom:1px solid #ffc4d8;padding-bottom:8px;}
  .item{margin-bottom:12px;}
  .item label{display:block;font-size:13px;color:#70002c;margin-bottom:4px;}
  .item input,.item select,.item textarea{width:100%;padding:10px;border:1px solid #ffc4d8;border-radius:10px;background:#fff8fa;font-size:14px;}
  .btn{width:100%;padding:12px;background:#e64980;color:#fff;border:none;border-radius:10px;margin-top:6px;font-size:15px;cursor:pointer;}
  .btn2{background:#fff;color:#a0003c;border:1px solid #ffc4d8;}
  .btn3{background:#ff4444;color:#fff;border:none;}
  .card{padding:14px;background:#ffe7ef;border-radius:12px;margin-bottom:14px;font-size:13px;color:#70002c;}
  .qbox{padding:16px;background:#fff8fa;border-radius:12px;margin-top:14px;display:none;}
  .qitem{margin-bottom:14px;}
  .qitem .q{font-size:13px;color:#70002c;margin-bottom:6px;}
  .opts{display:flex;flex-wrap:wrap;gap:6px;}
  .opts span{padding:6px 10px;border:1px solid #ffc4d8;border-radius:8px;font-size:12px;cursor:pointer;}
  .opts span.sel{background:#e64980;color:#fff;}
  .report{margin-top:16px;padding:16px;background:#fff8fa;border-radius:12px;white-space:pre-line;line-height:1.6;font-size:13px;display:none;}
  .pet-list{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
  .pet-card{padding:12px;border:1px solid #ffc4d8;border-radius:10px;background:#fff8fa;cursor:pointer;position:relative;}
  .pet-card img{width:100%;height:90px;border-radius:8px;object-fit:cover;margin-bottom:6px;background:#ddd;}
  .pet-card h4{font-size:14px;color:#a00033;margin-bottom:4px;}
  .pet-card p{font-size:12px;color:#777;}
  .pet-card .del{position:absolute;top:6px;right:6px;background:#ff4444;color:#fff;font-size:12px;padding:2px 6px;border-radius:6px;cursor:pointer;}
  .his-item{padding:12px;border:1px solid #ffc4d8;border-radius:10px;background:#fff8fa;margin-bottom:8px;}
  .his-top{display:flex;justify-content:space-between;align-items:center;}
  .his-top h4{font-size:14px;color:#a00033;}
  .his-top button{padding:4px 8px;font-size:12px;background:#ff4444;color:#fff;border:none;border-radius:6px;cursor:pointer;}
  .his-body{margin-top:8px;padding:10px;background:#fff;border-radius:8px;white-space:pre-line;font-size:12px;line-height:1.5;display:none;}
  .d-item{padding:10px;border-bottom:1px solid #f0f0f0;cursor:pointer;}
  .d-item h4{font-size:14px;color:#a00033;}
  .d-body{padding:10px;background:#fff8fa;border-radius:8px;margin-top:6px;font-size:12px;line-height:1.5;white-space:pre-line;display:none;}
  .search{padding:12px;border:1px solid #ffc4d8;border-radius:10px;width:100%;margin-bottom:12px;}
  .d-list{max-height:360px;overflow:auto;}
  .xray-box{padding:16px;background:#fff8fa;border-radius:12px;margin-top:10px;}
  .xray-preview{width:100%;height:220px;border:2px dashed #ffc4d8;border-radius:10px;display:flex;align-items:center;justify-content:center;background:#f8f8f8;}
  .xray-preview img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;}
  .xray-result{margin-top:12px;padding:12px;background:#fff;border-radius:8px;line-height:1.5;font-size:13px;white-space:pre-line;}
  .his-checkbox{width:16px;height:16px;margin-right:8px;cursor:pointer;}
  .delete-controls{display:flex;gap:10px;margin-bottom:10px;}
  .delete-controls button{flex:1;padding:12px;border-radius:10px;border:none;font-size:15px;cursor:pointer;}
  .btn-select-all{background:#ffc4d8;color:#a0003c;}
  .btn-confirm-delete{background:#ff4444;color:#fff;}
  .login-page{padding:24px;display:block;}
  .login-card{max-width:360px;margin:40px auto;background:#fff;padding:24px;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,0.1);}
  .login-card h2{text-align:center;color:#a00033;margin-bottom:20px;}
  .login-item{margin-bottom:16px;}
  .login-item label{font-size:13px;color:#70002c;margin-bottom:4px;display:block;}
  .login-item input{width:100%;padding:10px;border:1px solid #ffc4d8;border-radius:10px;background:#fff8fa;}
  .login-btn{width:100%;padding:12px;background:#e64980;color:#fff;border:none;border-radius:10px;margin-top:10px;font-size:15px;cursor:pointer;}
  .logout-btn{position:absolute;top:10px;right:10px;padding:6px 12px;background:#ff4444;color:#fff;border:none;border-radius:6px;font-size:12px;cursor:pointer;}
  .ai-loading{color:#e64980;font-size:13px;padding:6px 0;}
</style>
</head>
<body>
<div class="wrap">
  <div class="page show" id="loginPage">
    <div class="login-card">
      <h2>用户登录</h2>
      <div class="login-item">
        <label>用户名</label>
        <input id="username" placeholder="请输入用户名">
      </div>
      <div class="login-item">
        <label>密码</label>
        <input id="password" type="password" placeholder="请输入密码">
      </div>
      <button class="login-btn" id="loginBtn">登录</button>
      <button class="login-btn btn2" id="registerBtn" style="margin-top:8px;">注册新用户</button>
    </div>
  </div>

  <div class="page" id="mainPage">
    <button class="logout-btn" id="logoutBtn">退出登录</button>
    <div class="head"><h1>猫狗全科诊疗系统（AI版）</h1></div>
    <div class="nav">
      <span class="on" data-p="1">档案室</span>
      <span data-p="2">档案编辑</span>
      <span data-p="3">AI智能诊断</span>
      <span data-p="4">诊疗记录</span>
      <span data-p="5">AI疾病百科</span>
      <span data-p="6">X光识别</span>
    </div>

    <div class="sub-page show" id="p1">
      <div class="tit">宠物档案室（点击选择宠物诊断）</div>
      <div class="pet-list" id="petList"></div>
      <button class="btn" id="newPet" style="margin-top:10px">新增宠物</button>
    </div>

    <div class="sub-page" id="p2">
      <div class="tit">宠物档案编辑</div>
      <input type="hidden" id="editId">
      <div class="item"><label>主人姓名</label><input id="owner"></div>
      <div class="item"><label>宠物名字</label><input id="pname"></div>
      <div class="item"><label>种类</label><select id="ptype"><option value="">请选择</option><option value="狗">狗</option><option value="猫">猫</option></select></div>
      <div class="item"><label>品种</label><select id="pbreed"><option value="">请先选择宠物种类</option></select></div>
      <div class="item"><label>年龄</label><input id="page"></div>
      <div class="item"><label>体重(kg)</label><input id="pweight"></div>
      <div class="item"><label>性别</label><select id="pgender"><option>公</option><option>母</option></select></div>
      <div class="item"><label>是否绝育</label><select id="psterile"><option>未绝育</option><option>已绝育</option></select></div>
      <div class="item"><label>宠物照片（封面）</label><input type="file" id="avatar" accept="image/*"></div>

      <div class="tit">疫苗</div>
      <div class="item"><label>核心疫苗</label><select id="vac1"><option>未接种</option><option>1针</option><option>2针</option><option>3针全套</option><option>已加强</option></select></div>
      <div class="item"><label>狂犬疫苗</label><select id="vac2"><option>未接种</option><option>已接种</option><option>过期</option></select></div>

      <div class="tit">驱虫</div>
      <div class="item"><label>体内驱虫</label><select id="de1"><option>未做</option><option>1月内</option><option>3月内</option><option>半年以上</option></select></div>
      <div class="item"><label>体外驱虫</label><select id="de2"><option>未做</option><option>1月内</option><option>3月内</option></select></div>

      <button class="btn" id="savePet">保存档案</button>
      <button class="btn btn2" id="resetForm">清空表单</button>
    </div>

    <div class="sub-page" id="p3">
      <div class="card" id="usePet"></div>
      <div class="tit">主人描述症状</div>
      <div class="item"><textarea id="sym" placeholder="请详细描述症状，例如：呕吐、拉稀、咳嗽、不吃饭、后腿瘫痪、腹水肚大..."></textarea></div>
      <button class="btn" id="aiDiagnoseBtn">AI智能诊断</button>
      <div class="ai-loading" id="aiLoading" style="display:none">AI正在思考诊断中，请稍候...</div>
      <div class="report" id="report"></div>
    </div>

    <div class="sub-page" id="p4">
      <div class="tit">诊疗记录</div>
      <div class="delete-controls" id="deleteControls" style="display:none;">
        <button class="btn-select-all" id="selectAllBtn">全选/取消全选</button>
        <button class="btn-confirm-delete" id="confirmDeleteBtn">确定删除选中记录</button>
      </div>
      <div id="hisList"></div>
    </div>

    <div class="sub-page" id="p5">
      <div class="tit">AI疾病百科（DeepSeek问答）</div>
      <div class="item">
        <label>请输入疾病问题（如：猫瘟怎么治、狗细小症状、胰腺炎护理）</label>
        <textarea id="aiDiseaseQuery" rows="3" placeholder="例如：猫尿闭怎么处理？狗呕吐黄沫是什么病？"></textarea>
      </div>
      <button class="btn" id="aiDiseaseBtn">AI查询疾病知识</button>
      <div class="ai-loading" id="aiDiseaseLoading" style="display:none">AI正在查询疾病知识...</div>
      <div class="report" id="aiDiseaseResult" style="display:none;margin-top:12px"></div>
    </div>

    <div class="sub-page" id="p6">
      <div class="tit">X光影像识别</div>
      <div class="item"><label>上传X光片</label><input type="file" id="xrayFile" accept="image/*"></div>
      <div class="xray-box">
        <div class="xray-preview" id="xrayPreview"><span>请上传图片</span></div>
        <div class="xray-result" id="xrayResult"></div>
      </div>
    </div>
  </div>
</div>

<script>
const USERS_KEY = "users";
let currentUser = null;

 // 豆包 API 配置（你现在的 Key 直接用）
const DEEPSEEK_CONFIG = {
  apiKey: "513a8125-87ec-4538-87e4-265eed1255bb",
  model: "doubao-pro-128k-character",
  url: "https://ark.cn-beijing.volces.com/api/v3/chat/completions"
};

// 登录校验
function checkLogin() {
  const savedUser = sessionStorage.getItem('currentUser');
  if (savedUser) {
    currentUser = JSON.parse(savedUser);
    showMainPage();
  } else {
    showLoginPage();
  }
}

function showLoginPage() {
  document.getElementById('loginPage').classList.add('show');
  document.getElementById('mainPage').classList.remove('show');
}

function showMainPage() {
  document.getElementById('loginPage').classList.remove('show');
  document.getElementById('mainPage').classList.add('show');
  loadPetList();
  loadHis();
}

// 登录注册
document.getElementById('loginBtn').addEventListener('click', function() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();
  if (!username || !password) { alert('请输入用户名和密码'); return; }
  const users = JSON.parse(localStorage.getItem(USERS_KEY) || '{}');
  if (!users[username] || users[username].password !== password) { alert('用户名或密码错误'); return; }
  currentUser = { username };
  sessionStorage.setItem('currentUser', JSON.stringify(currentUser));
  sessionStorage.removeItem('usePet');
  showMainPage();
});

document.getElementById('registerBtn').addEventListener('click', function() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();
  if (!username || !password) { alert('请输入用户名和密码'); return; }
  const users = JSON.parse(localStorage.getItem(USERS_KEY) || '{}');
  if (users[username]) { alert('用户名已存在'); return; }
  users[username] = { password };
  localStorage.setItem(USERS_KEY, JSON.stringify(users));
  alert('注册成功，请登录');
});

document.getElementById('logoutBtn').addEventListener('click', function() {
  sessionStorage.removeItem('currentUser');
  sessionStorage.removeItem('usePet');
  currentUser = null;
  showLoginPage();
  document.getElementById('username').value = '';
  document.getElementById('password').value = '';
});

// 用户数据隔离
function getStorageKey(baseKey) {
  if (!currentUser || !currentUser.username) return baseKey;
  return `${baseKey}_${currentUser.username}`;
}
const PETS = "pet_list_v2";
const HIS = "pet_his_v2";

// 导航
document.querySelectorAll('.nav span').forEach(n=>{
  n.addEventListener('click', function() {
    document.querySelectorAll('.sub-page').forEach(p => p.classList.remove('show'));
    document.querySelectorAll('.nav span').forEach(s => s.classList.remove('on'));
    this.classList.add('on');
    const targetPage = document.getElementById('p' + this.dataset.p);
    if (targetPage) targetPage.classList.add('show');
    if(this.dataset.p==1) loadPetList();
    if(this.dataset.p==4) loadHis();
  });
})

// 品种联动
const breedData = {
  狗: ["泰迪","贵宾","比熊","博美","吉娃娃","约克夏","巴哥","法斗","柯基","雪纳瑞","西施","马尔济斯","京巴","蝴蝶犬","柴犬","边牧","哈士奇","萨摩耶","松狮","秋田","英斗","喜乐蒂","银狐","金毛","拉布拉多","阿拉斯加","德牧","杜宾","罗威纳","藏獒","卡斯罗","高加索","马士提夫","圣伯纳","大丹","田园犬"],
  猫: ["布偶","英短","美短","蓝猫","加菲","金渐层","银渐层","矮脚","缅因","暹罗","田园猫","橘猫","狸花猫","三花猫","金吉拉","波斯猫","德文卷毛","斯芬克斯"]
};

const ptypeSelect = document.getElementById('ptype');
const pbreedSelect = document.getElementById('pbreed');
ptypeSelect.addEventListener('change', function() {
  const t = this.value;
  pbreedSelect.innerHTML = '';
  if (!t) { pbreedSelect.innerHTML = '<option value="">请先选择宠物种类</option>'; return; }
  breedData[t].forEach(b=>{
    const opt = document.createElement('option');
    opt.value = b; opt.textContent = b;
    pbreedSelect.appendChild(opt);
  });
});

// 宠物档案
function loadPetList(){
  let list = JSON.parse(localStorage.getItem(getStorageKey(PETS))||"[]");
  let box = document.getElementById('petList');
  if(list.length===0){box.innerHTML="<div style=padding:10px>暂无宠物</div>";return;}
  box.innerHTML = list.map(p=>`
    <div class="pet-card">
      <div class="del" data-id="${p.id}">删除</div>
      ${p.avatar?`<img src="${p.avatar}">`:''}
      <h4>${p.name}（${p.type}）</h4>
      <p>${p.breed}｜${p.age}｜${p.weight}kg｜${p.sterile}</p>
    </div>
  `).join('');
  box.querySelectorAll('.del').forEach(d=>{
    d.onclick=(e)=>{ e.stopPropagation(); if(!confirm("删除该宠物？"))return;
      let arr = JSON.parse(localStorage.getItem(getStorageKey(PETS))||"[]");
      arr = arr.filter(x=>x.id!=d.dataset.id);
      localStorage.setItem(getStorageKey(PETS), JSON.stringify(arr));
      loadPetList();
    }
  });
  box.querySelectorAll('.pet-card').forEach(c=>{
    c.onclick=()=>{
      let id = c.querySelector('.del').dataset.id;
      let p = JSON.parse(localStorage.getItem(getStorageKey(PETS))||"[]").find(x=>x.id==id);
      sessionStorage.setItem('usePet', JSON.stringify(p));
      document.querySelector('[data-p="3"]').click();
      showUsePet();
    }
  });
}

function showUsePet(){
  let p = sessionStorage.getItem('usePet');
  if(!p){document.getElementById('usePet').innerHTML="<b>请先在档案室选择宠物</b>";return;}
  p = JSON.parse(p);
  document.getElementById('usePet').innerHTML = `
<b>当前：${p.name}（${p.type}）</b><br>
品种：${p.breed}｜年龄：${p.age}｜体重：${p.weight}kg｜性别：${p.gender}｜绝育：${p.sterile}<br>
疫苗：${p.vac1}｜狂犬：${p.vac2}｜体内：${p.de1}｜体外：${p.de2}
  `;
}

document.getElementById('newPet').addEventListener('click', function() {
  document.getElementById('editId').value='';
  document.getElementById('owner').value='';
  document.getElementById('pname').value='';
  ptypeSelect.value = '';
  pbreedSelect.innerHTML = '<option value="">请先选择宠物种类</option>';
  document.getElementById('page').value='';
  document.getElementById('pweight').value='';
  document.getElementById('avatar').value='';
  document.querySelector('[data-p="2"]').click();
});

document.getElementById('resetForm').addEventListener('click', function() {
  document.getElementById('editId').value='';
  document.getElementById('owner').value='';
  document.getElementById('pname').value='';
  ptypeSelect.value = '';
  pbreedSelect.innerHTML = '<option value="">请先选择宠物种类</option>';
  document.getElementById('page').value='';
  document.getElementById('pweight').value='';
  document.getElementById('avatar').value='';
});

document.getElementById('savePet').addEventListener('click', async function() {
  let id = document.getElementById('editId').value || Date.now();
  let name = document.getElementById('pname').value;
  let type = ptypeSelect.value;
  let breed = pbreedSelect.value;
  if(!name||!type||!breed){alert("请完善宠物信息");return;}
  let file = document.getElementById('avatar').files[0];
  let avatar = "";
  if(file){
    avatar = await new Promise(r=>{
      let fr = new FileReader();
      fr.onload=()=>r(fr.result);
      fr.readAsDataURL(file);
    });
  }
  let item = {
    id, owner:document.getElementById('owner').value, name, type, breed,
    age:document.getElementById('page').value,
    weight:document.getElementById('pweight').value,
    gender:document.getElementById('pgender').value,
    sterile:document.getElementById('psterile').value,
    vac1:document.getElementById('vac1').value,
    vac2:document.getElementById('vac2').value,
    de1:document.getElementById('de1').value,
    de2:document.getElementById('de2').value,
    avatar
  };
  let list = JSON.parse(localStorage.getItem(getStorageKey(PETS))||"[]");
  let idx = list.findIndex(x=>x.id==id);
  if(idx>-1) list[idx]=item; else list.unshift(item);
  localStorage.setItem(getStorageKey(PETS), JSON.stringify(list));
  alert("保存成功！");
  document.querySelector('[data-p="1"]').click();
});

// =============================================
// DeepSeek AI 智能诊断（核心新增）
// =============================================
document.getElementById('aiDiagnoseBtn').addEventListener('click', async function() {
  const petStr = sessionStorage.getItem('usePet');
  if (!petStr) { alert("请先在档案室选择宠物"); return; }
  const pet = JSON.parse(petStr);
  const sym = document.getElementById('sym').value.trim();
  if (!sym) { alert("请输入症状描述"); return; }

  const loading = document.getElementById('aiLoading');
  const report = document.getElementById('report');
  loading.style.display = "block";
  report.style.display = "none";

  try {
    const prompt = `你是专业执业兽医，根据以下宠物信息和症状，给出专业诊断、病因、建议治疗方案、护理注意事项，语言通俗严谨，分点说明。
宠物信息：
种类：${pet.type}，品种：${pet.breed}，年龄：${pet.age}，体重：${pet.weight}kg，性别：${pet.gender}，绝育：${pet.sterile}
疫苗：${pet.vac1}，狂犬：${pet.vac2}，体内驱虫：${pet.de1}，体外驱虫：${pet.de2}
主人描述症状：${sym}
请给出：1.可能疾病 2.紧急程度 3.家庭处理 4.就医建议 5.注意事项`;

    const res = await fetch(DEEPSEEK_CONFIG.url, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${DEEPSEEK_CONFIG.apiKey}`
      },
      body: JSON.stringify({
        model: DEEPSEEK_CONFIG.model,
        messages: [{ role: "user", content: prompt }],
        temperature: 0.3,
        max_tokens: 1500
      })
    });

    const data = await res.json();
    const aiText = data.choices?.[0]?.message?.content || "AI返回异常";

    const fullReport = `【${pet.name}｜DeepSeek AI 智能诊断】
——————————————
档案：${pet.breed} ${pet.age}岁 ${pet.weight}kg｜${pet.gender}｜${pet.sterile}
疫苗：${pet.vac1} 狂犬：${pet.vac2}
驱虫：体内${pet.de1} 体外${pet.de2}
症状：${sym}
——————————————
${aiText}

——————————————
⚠️ 本报告由AI生成，仅供参考，重症请立即就医`;

    report.innerText = fullReport;
    report.style.display = "block";

    // 保存记录
    let hs = JSON.parse(localStorage.getItem(getStorageKey(HIS))||"[]");
    hs.unshift({
      id: Date.now(),
      name: pet.name,
      type: pet.type,
      t: new Date().toLocaleString(),
      text: fullReport
    });
    if (hs.length > 60) hs.pop();
    localStorage.setItem(getStorageKey(HIS), JSON.stringify(hs));

  } catch (e) {
    report.innerText = "AI请求失败：" + e.message + "\n请检查网络或API密钥是否正确";
    report.style.display = "block";
  } finally {
    loading.style.display = "none";
  }
});

document.getElementById('aiDiseaseBtn').addEventListener('click', async function() {
  const q = document.getElementById('aiDiseaseQuery').value.trim();
  if (!q) { alert("请输入疾病问题"); return; }

  const loading = document.getElementById('aiDiseaseLoading');
  const result = document.getElementById('aiDiseaseResult');
  loading.style.display = "block";
  result.style.display = "none";

  try {
    const prompt = `你是猫狗全科兽医专家，回答以下宠物疾病问题，要求专业、清晰、易懂，分点说明：
问题：${q}
请包含：定义、症状、原因、处理、预防`;

    const res = await fetch(DEEPSEEK_CONFIG.url, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${DEEPSEEK_CONFIG.apiKey}`
      },
      body: JSON.stringify({
        model: DEEPSEEK_CONFIG.model,
        messages: [{ role: "user", content: prompt }],
        temperature: 0.2,
        max_tokens: 1200
      })
    });

    const data = await res.json();
    const aiText = data.choices?.[0]?.message?.content || "AI返回异常";
    result.innerText = `【DeepSeek AI 疾病解答】\n问题：${q}\n——————————————\n${aiText}`;
    result.style.display = "block";
  } catch (e) {
    result.innerText = "查询失败：" + e.message;
    result.style.display = "block";
  } finally {
    loading.style.display = "none";
  }
});

// 诊疗记录
function loadHis(){
  let hs = JSON.parse(localStorage.getItem(getStorageKey(HIS))||"[]");
  let box = document.getElementById('hisList');
  let delBar = document.getElementById('deleteControls');
  if(hs.length===0){ box.innerHTML="<div style=padding:10px>暂无记录</div>"; delBar.style.display='none'; return; }
  delBar.style.display='flex';
  box.innerHTML = hs.map(h=>`
    <div class="his-item">
      <div class="his-top">
        <div style="display:flex;align-items:center;">
          <input type="checkbox" class="his-checkbox" data-id="${h.id}">
          <h4>${h.name}（${h.type}）｜${h.t}</h4>
        </div>
        <button class="delHis" data-id="${h.id}">删除</button>
      </div>
      <div class="his-body">${h.text}</div>
    </div>
  `).join('');
  box.querySelectorAll('.delHis').forEach(b=>{
    b.addEventListener('click', function() {
      if(!confirm("删除？"))return;
      let arr = JSON.parse(localStorage.getItem(getStorageKey(HIS))||"[]");
      arr = arr.filter(x=>x.id!=this.dataset.id);
      localStorage.setItem(getStorageKey(HIS), JSON.stringify(arr));
      loadHis();
    });
  });
  box.querySelectorAll('.his-top').forEach(t=>{
    t.addEventListener('click', function(e) {
      if(e.target.classList.contains('his-checkbox')) return;
      let body = this.nextElementSibling;
      body.style.display = body.style.display=="none"?"block":"none";
    });
  });
}

document.getElementById('selectAllBtn').addEventListener('click', function() {
  let list = document.querySelectorAll('.his-checkbox');
  let all = Array.from(list).every(c=>c.checked);
  list.forEach(c=>c.checked = !all);
});

document.getElementById('confirmDeleteBtn').addEventListener('click', function() {
  let sel = document.querySelectorAll('.his-checkbox:checked');
  if(sel.length===0){alert("请选择");return;}
  if(!confirm("删除选中？"))return;
  let ids = Array.from(sel).map(c=>c.dataset.id);
  let hs = JSON.parse(localStorage.getItem(getStorageKey(HIS))||"[]");
  hs = hs.filter(h=>!ids.includes(h.id+""));
  localStorage.setItem(getStorageKey(HIS), JSON.stringify(hs));
  loadHis();
});
