<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>🐾 宠物健康小助手</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        }
        body {
            background: #fff5f8;
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(255, 182, 193, 0.2);
            overflow: hidden;
        }
        .header {
            background: #ffb6c1;
            color: #c2185b;
            padding: 20px;
            text-align: center;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .header p {
            font-size: 14px;
            opacity: 0.9;
        }
        .tab-bar {
            display: flex;
            border-bottom: 1px solid #ffebee;
            background: #f8fff8;
        }
        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            font-size: 15px;
            font-weight: 500;
            color: #f06292;
            cursor: pointer;
            transition: all 0.3s;
        }
        .tab.active {
            color: #c2185b;
            border-bottom: 2px solid #f06292;
            background: #fff;
        }
        .content {
            padding: 25px 20px;
            display: none;
        }
        .content.active {
            display: block;
        }
        .section-title {
            font-size: 17px;
            font-weight: 600;
            color: #c2185b;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #ffb6c1;
        }
        .form-row {
            margin-bottom: 15px;
        }
        .form-row label {
            display: block;
            font-size: 14px;
            color: #c2185b;
            margin-bottom: 6px;
        }
        .form-row input, .form-row select, .form-row textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ffcdd2;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
            background: #fff8fa;
        }
        .form-row input:focus, .form-row select:focus, .form-row textarea:focus {
            border-color: #f06292;
            box-shadow: 0 0 0 3px rgba(240, 98, 146, 0.15);
        }
        .form-row textarea {
            height: 120px;
            resize: none;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: #f06292;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn:hover {
            background: #ec407a;
        }
        .auto-questions {
            margin-top: 20px;
            padding: 20px;
            background: #fff8fa;
            border-radius: 16px;
            border: 1px solid #ffcdd2;
            display: none;
        }
        .question-item {
            margin-bottom: 15px;
        }
        .question-text {
            font-size: 15px;
            color: #c2185b;
            margin-bottom: 10px;
            font-weight: 500;
        }
        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .options label {
            background: #fff;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 13px;
            color: #c2185b;
            cursor: pointer;
            border: 1px solid #ffcdd2;
            transition: all 0.2s;
        }
        .options input:checked + span {
            background: #f06292;
            color: white;
            border-color: #f06292;
        }
        .result {
            margin-top: 25px;
            padding: 20px;
            background: #fff8fa;
            border-radius: 16px;
            border: 1px solid #ffcdd2;
            font-size: 14px;
            line-height: 1.8;
            white-space: pre-line;
            display: none;
        }
        .danger {
            color: #d32f2f;
            font-weight: 600;
        }
        .warning {
            color: #f57c00;
            font-weight: 600;
        }
        .safe {
            color: #388e3c;
            font-weight: 600;
        }
        .pet-info-card {
            padding: 15px;
            background: #ffebee;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .pet-info-card h4 {
            color: #c2185b;
            margin-bottom: 8px;
        }
        .pet-info-card p {
            font-size: 13px;
            color: #ad1457;
            line-height: 1.6;
        }
        .checkbox-group {
            display: flex;
            gap: 15px;
            margin-bottom: 8px;
        }
        .checkbox-group label {
            font-size: 13px;
            color: #c2185b;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🐾 宠物健康小助手</h1>
            <p>温暖陪伴 | 专业诊断 | 贴心护理</p>
        </div>
        <div class="tab-bar">
            <div class="tab active" onclick="switchTab('profile')">🐾 宠物档案</div>
            <div class="tab" onclick="switchTab('diagnosis')">🩺 健康诊断</div>
            <div class="tab" onclick="switchTab('history')">📋 诊疗记录</div>
        </div>

        <!-- 宠物档案 -->
        <div class="content active" id="profile">
            <div class="section-title">动物基本信息（选填项可留空）</div>
            <div class="form-row">
                <label>动物主人/饲养单位（选填）</label>
                <input type="text" id="ownerName" placeholder="如：张小姐">
            </div>
            <div class="form-row">
                <label>宠物姓名</label>
                <input type="text" id="petName" placeholder="如：多多">
            </div>
            <div class="form-row">
                <label>宠物照片（选填）</label>
                <input type="file" id="petPhoto" accept="image/*" style="padding:8px; background:#fff8fa; border:1px solid #ffcdd2; border-radius:12px;">
                <div style="margin-top:10px; text-align:center;">
                    <img id="previewPhoto" src="" alt="宠物照片预览" style="max-width:200px; max-height:200px; border-radius:12px; display:none; border:2px solid #ffcdd2;">
                </div>
            </div>
            <div class="form-row">
                <label>种类品种</label>
                <input type="text" id="petBreed" placeholder="如：犬（哈士奇）或 猫（美短）">
            </div>
            <div class="form-row">
                <label>宠物体重 (kg)（选填）</label>
                <input type="number" id="petWeight" placeholder="如：26.8">
            </div>
            <div class="form-row">
                <label>性别（选填）</label>
                <select id="petGender">
                    <option value="公">公</option>
                    <option value="母">母</option>
                </select>
            </div>
            <div class="form-row">
                <label>宠物毛色（选填）</label>
                <input type="text" id="petCoat" placeholder="如：烟灰色/三花">
            </div>
            <div class="form-row">
                <label>年（日）龄（选填，可简写）</label>
                <input type="text" id="petAge" placeholder="如：2岁3月21天 或 2岁">
            </div>
            <div class="section-title">日粮及免疫情况（选填）</div>
            <div class="form-row">
                <label>日粮品牌及饲喂方式</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" id="feedCommercialDry"> 商品干粮</label>
                    <label><input type="checkbox" id="feedCommercialWet"> 商品湿粮</label>
                    <label><input type="checkbox" id="feedHomemade" checked> 家庭自制</label>
                    <label><input type="checkbox" id="feedSnacks"> 宠物零食</label>
                </div>
            </div>
            <div class="form-row">
                <label>饲喂频率</label>
                <select id="feedFrequency">
                    <option value="1次/日">1次/日</option>
                    <option value="2次/日" selected>2次/日</option>
                    <option value="3次/日">3次/日</option>
                    <option value="自由采食">自由采食</option>
                </select>
            </div>
            <div class="form-row">
                <label>近期食物变动（选填）</label>
                <input type="text" id="foodChange" placeholder="最近暂无变化">
            </div>
            <div class="form-row">
                <label>免疫及驱虫情况（选填）</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" id="dewormInternal" onchange="toggleDewormInput('internal')"> 体内驱虫</label>
                    <label><input type="checkbox" id="dewormExternal" onchange="toggleDewormInput('external')"> 体外驱虫</label>
                </div>
            </div>
            <div class="form-row" id="dewormInternalRow" style="display:none;">
                <label>体内驱虫药品牌/名称（选填）</label>
                <input type="text" id="dewormInternalDrug" placeholder="如：犬心保">
            </div>
            <div class="form-row" id="dewormInternalFreqRow" style="display:none;">
                <label>体内驱虫频率（选填）</label>
                <input type="text" id="dewormInternalFreq" placeholder="如：1个月/次">
            </div>
            <div class="form-row" id="dewormExternalRow" style="display:none;">
                <label>体外驱虫药品牌/名称（选填）</label>
                <input type="text" id="dewormExternalDrug" placeholder="如：福来恩">
            </div>
            <div class="form-row" id="dewormExternalFreqRow" style="display:none;">
                <label>体外驱虫频率（选填）</label>
                <input type="text" id="dewormExternalFreq" placeholder="如：1个月/次">
            </div>
            <button class="btn" onclick="savePet()">💾 保存宠物档案</button>
        </div>

        <!-- 健康诊断 -->
        <div class="content" id="diagnosis">
            <div id="petInfoCard" class="pet-info-card" style="display:none;">
                <h4>当前就诊宠物</h4>
                <p id="petInfoText"></p>
            </div>
            <div class="section-title">主诉信息</div>
            <div class="form-row">
                <label>请详细描述宠物当前症状</label>
                <textarea id="chiefComplaint" placeholder="如：吐黄水、后肢跛行、咳嗽、头歪斜等..."></textarea>
            </div>
            <button class="btn" onclick="genQuestions()">✨ 生成问诊</button>
            <div class="auto-questions" id="questions">
                <div class="section-title">补充细节（系统自动生成）</div>
                <div id="questionList"></div>
                <button class="btn" onclick="analyze()">🩺 生成诊断报告</button>
            </div>
            <div class="result" id="result"></div>
        </div>

        <!-- 诊疗记录 -->
        <div class="content" id="history">
            <div class="section-title">诊疗历史</div>
            <div id="historyList" style="font-size:14px; color:#c2185b; line-height:1.8;"></div>
        </div>
    </div>

    <script>
        let currentPet = null;
        let selectedAnswers = {};
        let diagnosisHistory = JSON.parse(localStorage.getItem("diagnosisHistory")) || [];

        // 切换标签
        function switchTab(tab) {
            document.querySelectorAll(".content").forEach(c => c.classList.remove("active"));
            document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
            document.getElementById(tab).classList.add("active");
            document.querySelector(`.tab-bar .tab:nth-child(${tab === 'profile' ? 1 : tab === 'diagnosis' ? 2 : 3})`).classList.add("active");
            if (tab === 'diagnosis' && currentPet) {
                document.getElementById("petInfoCard").style.display = "block";
                document.getElementById("petInfoText").innerHTML = `
                    ${currentPet.petName} | ${currentPet.petBreed} | ${currentPet.petWeight || '未填写'}kg | ${currentPet.petGender} | ${currentPet.petAge || '未填写'}<br>
                    主人：${currentPet.ownerName || '未填写'} | 饲喂：${currentPet.feedFrequency}
                `;
            }
            if (tab === 'history') renderHistory();
        }

        // 切换驱虫输入框显示
        function toggleDewormInput(type) {
            const isInternal = type === 'internal';
            const row = document.getElementById(`deworm${isInternal ? 'Internal' : 'External'}Row`);
            const freqRow = document.getElementById(`deworm${isInternal ? 'Internal' : 'External'}FreqRow`);
            const checkbox = document.getElementById(`deworm${type}`);
            const display = checkbox.checked ? "block" : "none";
            row.style.display = display;
            freqRow.style.display = display;
        }

        // 预览宠物照片
        document.getElementById("petPhoto").addEventListener("change", function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.getElementById("previewPhoto");
                    img.src = e.target.result;
                    img.style.display = "block";
                }
                reader.readAsDataURL(file);
            }
        });

        // 保存宠物档案
        function savePet() {
            const petName = document.getElementById("petName").value;
            const petBreed = document.getElementById("petBreed").value;
            if (!petName || !petBreed) {
                alert("请填写宠物姓名和品种！");
                return;
            }
            currentPet = {
                ownerName: document.getElementById("ownerName").value,
                petName, petBreed,
                petWeight: document.getElementById("petWeight").value,
                petGender: document.getElementById("petGender").value,
                petCoat: document.getElementById("petCoat").value,
                petAge: document.getElementById("petAge").value,
                feedFrequency: document.getElementById("feedFrequency").value,
                foodChange: document.getElementById("foodChange").value,
                dewormInternal: document.getElementById("dewormInternal").checked,
                dewormInternalDrug: document.getElementById("dewormInternalDrug").value,
                dewormInternalFreq: document.getElementById("dewormInternalFreq").value,
                dewormExternal: document.getElementById("dewormExternal").checked,
                dewormExternalDrug: document.getElementById("dewormExternalDrug").value,
                dewormExternalFreq: document.getElementById("dewormExternalFreq").value
            };
            alert("宠物档案保存成功！");
            switchTab('diagnosis');
        }

        // 生成问诊问题
        function genQuestions() {
            const desc = document.getElementById("chiefComplaint").value;
            const qList = document.getElementById("questionList");
            const qBox = document.getElementById("questions");
            qList.innerHTML = "";
            selectedAnswers = {};
            if (!desc) { alert("请先填写主诉信息！"); return; }
            if (!currentPet) { alert("请先保存宠物档案！"); return; }

            if (/头歪|斜颈/.test(desc)) addQuestion("q1", "头颈部症状：", ["单侧歪头", "眼球震颤", "流口水"]);
            if (/跛行|腿瘸/.test(desc)) addQuestion("q2", "肢体症状：", ["后肢三脚跳", "不愿上下楼", "关节疼痛"]);
            if (/吐黄水|呕吐/.test(desc)) addQuestion("q3", "呕吐情况：", ["吐黄水/泡沫", "频繁呕吐", "吐带血"]);
            if (/拉稀|软便/.test(desc)) addQuestion("q4", "排便情况：", ["软便", "水样便", "便中有虫"]);
            if (/咳嗽|流鼻涕/.test(desc)) addQuestion("q5", "呼吸道症状：", ["干咳", "流涕", "呼吸急促"]);
            if (qList.children.length === 0) addQuestion("q0", "是否有以下情况：", ["精神差", "食欲下降"]);
            qBox.style.display = "block";
        }

        function addQuestion(id, text, opts) {
            const div = document.createElement("div");
            div.className = "question-item";
            div.innerHTML = `
                <div class="question-text">${text}</div>
                <div class="options">
                    ${opts.map(opt => `
                        <label>
                            <input type="checkbox" name="${id}" value="${opt}" onchange="saveAnswer('${id}','${opt}')">
                            <span>${opt}</span>
                        </label>
                    `).join('')}
                </div>
            `;
            document.getElementById("questionList").appendChild(div);
        }

        function saveAnswer(qid, val) {
            if (!selectedAnswers[qid]) selectedAnswers[qid] = [];
            const idx = selectedAnswers[qid].indexOf(val);
            idx > -1 ? selectedAnswers[qid].splice(idx, 1) : selectedAnswers[qid].push(val);
        }

        // 专业诊断逻辑
        function analyze() {
            const res = document.getElementById("result");
            let txt = `【${currentPet.petName} 专业诊断报告】\n`;
            let advice = "\n【治疗与护理方案】\n";
            let danger = false;

            if (selectedAnswers.q3?.includes("吐黄水/泡沫")) {
                txt += "🟠 可能：慢性胃炎/胆汁反流综合征\n";
                txt += "   典型表现：空腹时吐黄色胆汁，进食后缓解，食欲时好时坏\n";
            }
            if (selectedAnswers.q4?.includes("便中有虫")) {
                txt += "🟡 明确诊断：肠道寄生虫感染（蛔虫/绦虫）\n";
                txt += "   典型表现：粪便中可见虫体/虫卵，消瘦、软便、腹胀\n";
            }
            if (["泰迪", "比熊", "吉娃娃", "博美"].some(b => currentPet.petBreed.includes(b)) && selectedAnswers.q2?.includes("后肢三脚跳")) {
                txt += "🟡 可能：髌骨脱位（Ⅱ级）\n";
                txt += "   典型表现：突然跛行、三脚跳、不愿上下楼梯，休息后缓解\n";
            }
            if (selectedAnswers.q1 && selectedAnswers.q2) {
                txt += "🔴 高度怀疑：前庭综合征（外周型）\n";
                txt += "   典型表现：突发性头歪斜+步态不稳，常伴中耳/内耳感染\n";
                danger = true;
            }
            if (selectedAnswers.q5?.includes("干咳") && selectedAnswers.q5?.includes("呼吸急促")) {
                txt += "🟠 可能：犬窝咳/肺炎\n";
                txt += "   典型表现：阵发性干咳、运动后加重，严重时伴发热\n";
            }

            if (danger) {
                advice = "\n⚠️ 【紧急处理】请立即带宠物就医！\n";
                advice += "   就诊前：禁食禁水，注意保暖，避免剧烈运动\n";
            } else {
                advice = "\n✅ 【居家护理】\n";
                if (selectedAnswers.q3?.includes("吐黄水/泡沫")) advice += "• 饮食：少量多餐喂易消化粮，可喂硫糖铝保护胃黏膜\n";
                if (selectedAnswers.q4?.includes("便中有虫")) advice += "• 驱虫：立即用广谱体内驱虫药，2周后复驱\n";
                if (selectedAnswers.q2?.includes("后肢三脚跳")) advice += "• 关节：限制运动，避免上下楼梯，补充软骨素\n";
                if (selectedAnswers.q5) advice += "• 呼吸道：注意保暖，喂温水，避免剧烈运动\n";
                advice += "• 观察24小时，若症状加重请及时就医\n";
            }

            if (txt === `【${currentPet.petName} 专业诊断报告】\n`) {
                txt += "• 目前症状轻微，多为应激或短期不适\n";
                advice = "\n【建议】正常喂养，注意保暖，持续观察即可。";
            }

            diagnosisHistory.push({ petName: currentPet.petName, date: new Date().toLocaleString(), result: txt + advice });
            localStorage.setItem("diagnosisHistory", JSON.stringify(diagnosisHistory));
            res.innerHTML = txt + advice;
            res.style.display = "block";
        }

        // 渲染历史记录
        function renderHistory() {
            const list = document.getElementById("historyList");
            if (diagnosisHistory.length === 0) { list.innerHTML = "暂无诊疗记录"; return; }
            list.innerHTML = diagnosisHistory.map(h => `
                <div style="padding:15px; background:#fff8fa; border-radius:12px; margin-bottom:12px; border:1px solid #ffcdd2;">
                    <h4 style="color:#c2185b; margin-bottom:8px;">${h.petName} | ${h.date}</h4>
                    <p style="font-size:13px; color:#ad1457;">${h.result.substring(0, 100)}...</p>
                </div>
            `).join('');
        }

        window.onload = () => switchTab('profile');
    </script>
</body>
</html>
