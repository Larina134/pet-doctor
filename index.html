<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>猫狗全科诊疗系统（完整版·可保存·可打开）</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial;}
  body{background:#fff5f8;padding:10px;}
  .wrap{max-width:900px;margin:0 auto;background:#fff;border-radius:16px;overflow:hidden;}
  .head{background:#ffb6c1;padding:18px;text-align:center;}
  .head h1{font-size:20px;color:#800033;}
  .nav{display:flex;background:#fff8fa;}
  .nav span{flex:1;padding:14px;text-align:center;font-size:14px;cursor:pointer;}
  .nav span.on{background:#fff;color:#a0003c;border-bottom:2px solid #e64980;font-weight:600;}
  .page{padding:18px;display:none;}
  .page.show{display:block;}
  .tit{font-size:16px;color:#a0003c;margin:10px 0 12px;border-bottom:1px solid #ffc4d8;padding-bottom:8px;}
  .item{margin-bottom:12px;}
  .item label{display:block;font-size:13px;color:#70002c;margin-bottom:4px;}
  .item input,.item select,.item textarea{width:100%;padding:10px;border:1px solid #ffc4d8;border-radius:10px;background:#fff8fa;font-size:14px;}
  .btn{width:100%;padding:12px;background:#e64980;color:#fff;border:none;border-radius:10px;margin-top:6px;font-size:15px;cursor:pointer;}
  .btn2{background:#fff;color:#a0003c;border:1px solid #ffc4d8;}
  .card{padding:14px;background:#ffe7ef;border-radius:12px;margin-bottom:14px;font-size:13px;color:#70002c;}
  .qbox{padding:16px;background:#fff8fa;border-radius:12px;margin-top:14px;display:none;}
  .qitem{margin-bottom:14px;}
  .qitem .q{font-size:13px;color:#70002c;margin-bottom:6px;}
  .opts{display:flex;flex-wrap:wrap;gap:6px;}
  .opts span{padding:6px 10px;border:1px solid #ffc4d8;border-radius:8px;font-size:12px;cursor:pointer;}
  .opts span.sel{background:#e64980;color:#fff;}
  .report{margin-top:16px;padding:16px;background:#fff8fa;border-radius:12px;white-space:pre-line;line-height:1.6;font-size:13px;display:none;}
  .list .itemx{padding:12px;background:#fff8fa;border-radius:10px;margin-bottom:10px;border:1px solid #ffc4d8;cursor:pointer;}
  .itemx h4{font-size:14px;color:#a0003c;margin-bottom:4px;}
  .itemx p{font-size:12px;color:#777;}
  .detail{padding:16px;background:#fff;border:1px solid #ffc4d8;border-radius:12px;margin-top:10px;display:none;}
  .search{padding:12px;border:1px solid #ffc4d8;border-radius:10px;width:100%;margin-bottom:12px;}
  .dlist{max-height:320px;overflow:auto;}
  .ditem{padding:10px;border-bottom:1px solid #f0f0f0;cursor:pointer;}
  .ditem h4{font-size:14px;color:#a0003c;}
  .ddetail{display:none;padding-top:10px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><h1>猫狗全科诊疗系统（可保存·可打开·完整版）</h1></div>
  <div class="nav">
    <span class="on" data-p="1">宠物档案</span>
    <span data-p="2">症状诊断</span>
    <span data-p="3">诊疗记录</span>
    <span data-p="4">疾病百科</span>
  </div>

  <!-- 1 档案 -->
  <div class="page show" id="p1">
    <div class="tit">宠物档案（保存后永久存在）</div>
    <div class="item"><label>主人姓名</label><input id="owner"></div>
    <div class="item"><label>宠物名字</label><input id="pname"></div>
    <div class="item"><label>种类</label><select id="ptype"><option>狗</option><option>猫</option></select></div>
    <div class="item"><label>品种</label><input id="pbreed"></div>
    <div class="item"><label>年龄</label><input id="page"></div>
    <div class="item"><label>体重(kg)</label><input id="pweight"></div>
    <div class="item"><label>性别</label><select id="pgender"><option>公</option><option>母</option></select></div>

    <div class="tit">疫苗（规范分类）</div>
    <div class="item"><label>核心疫苗（四联/八联/三联）</label><select id="vac1"><option>未接种</option><option>1针</option><option>2针</option><option>3针全套</option><option>已加强</option></select></div>
    <div class="item"><label>狂犬疫苗</label><select id="vac2"><option>未接种</option><option>已接种</option><option>过期</option></select></div>

    <div class="tit">驱虫</div>
    <div class="item"><label>体内驱虫</label><select id="de1"><option>未做</option><option>1月内</option><option>3月内</option><option>半年以上</option></select></div>
    <div class="item"><label>体外驱虫</label><select id="de2"><option>未做</option><option>1月内</option><option>3月内</option></select></div>

    <button class="btn" id="savePet">保存档案（永久有效）</button>
    <button class="btn btn2" id="loadPet">加载已保存档案</button>
  </div>

  <!-- 2 诊断 -->
  <div class="page" id="p2">
    <div class="card" id="pcard"></div>
    <div class="tit">主人描述症状</div>
    <div class="item"><textarea id="sym" placeholder="呕吐、拉稀、咳嗽、吐血、拉血、抽搐、不吃饭、尿不出..."></textarea></div>
    <button class="btn" id="startQ">开始问诊</button>

    <div class="qbox" id="qbox">
      <div class="qitem">
        <div class="q">症状持续时间</div>
        <div class="opts" data-key="day">
          <span>1天内</span><span>2-3天</span><span>4-7天</span><span>1-2周</span><span>2周以上</span>
        </div>
      </div>
    </div>

    <button class="btn" id="makeR" style="display:none;margin-top:10px">生成完整诊断报告</button>
    <div class="report" id="report"></div>
  </div>

  <!-- 3 记录（可点开） -->
  <div class="page" id="p3">
    <div class="tit">诊疗记录（点击任意一条查看完整报告）</div>
    <div class="list" id="historyList"></div>
    <div class="detail" id="detailView"></div>
  </div>

  <!-- 4 百科 -->
  <div class="page" id="p4">
    <div class="tit">猫狗疾病百科（可搜索·点开看详情）</div>
    <input class="search" id="searchD" placeholder="搜索疾病：细小、尿闭、猫瘟、胰腺炎、皮肤病...">
    <div class="dlist" id="dlist"></div>
    <div class="ddetail" id="ddetail"></div>
  </div>
</div>

<script>
// 导航
document.querySelectorAll('.nav span').forEach(n=>{
  n.onclick=()=>{
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('show'));
    document.querySelectorAll('.nav span').forEach(s=>s.classList.remove('on'));
    n.classList.add('on');
    document.getElementById('p'+n.dataset.p).classList.add('show');
    if(n.dataset.p==3) loadHistory();
    if(n.dataset.p==4) loadAllDisease();
  }
})

// 本地存储键
const PET_KEY = "petdata_full";
const REC_KEY = "petrecs_full";

// 保存档案
document.getElementById('savePet').onclick=()=>{
  let d = {
    owner: document.getElementById('owner').value,
    name: document.getElementById('pname').value,
    type: document.getElementById('ptype').value,
    breed: document.getElementById('pbreed').value,
    age: document.getElementById('page').value,
    weight: document.getElementById('pweight').value,
    gender: document.getElementById('pgender').value,
    vac1: document.getElementById('vac1').value,
    vac2: document.getElementById('vac2').value,
    de1: document.getElementById('de1').value,
    de2: document.getElementById('de2').value,
    t: new Date().toLocaleString()
  };
  if(!d.name){alert("请填写宠物名");return;}
  localStorage.setItem(PET_KEY, JSON.stringify(d));
  alert("档案已保存到本地！关闭网页再打开也不会丢！");
}

// 加载档案
document.getElementById('loadPet').onclick=()=>{
  let d = localStorage.getItem(PET_KEY);
  if(!d){alert("暂无保存的档案");return;}
  d = JSON.parse(d);
  document.getElementById('owner').value = d.owner||'';
  document.getElementById('pname').value = d.name||'';
  document.getElementById('ptype').value = d.type||'狗';
  document.getElementById('pbreed').value = d.breed||'';
  document.getElementById('page').value = d.age||'';
  document.getElementById('pweight').value = d.weight||'';
  document.getElementById('pgender').value = d.gender||'公';
  document.getElementById('vac1').value = d.vac1||'未接种';
  document.getElementById('vac2').value = d.vac2||'未接种';
  document.getElementById('de1').value = d.de1||'未做';
  document.getElementById('de2').value = d.de2||'未做';
  alert("已加载上次保存的档案");
}

// 获取当前宠物
function getPet(){
  let d = localStorage.getItem(PET_KEY);
  if(!d) return null;
  return JSON.parse(d);
}

// 选项点击
let sel = {};
document.querySelectorAll('.opts').forEach(g=>{
  g.querySelectorAll('span').forEach(s=>{
    s.onclick=()=>{
      s.classList.toggle('sel');
      let k = g.dataset.key;
      if(!sel[k]) sel[k]=new Set();
      sel[k].has(s.innerText) ? sel[k].delete(s.innerText) : sel[k].add(s.innerText);
    }
  })
})

// 开始问诊
document.getElementById('startQ').onclick=()=>{
  let pet = getPet();
  if(!pet){alert("请先保存/加载档案");return;}
  let sym = document.getElementById('sym').value;
  if(!sym){alert("请输入症状");return;}
  document.getElementById('qbox').style.display='block';
  document.getElementById('makeR').style.display='block';
  document.getElementById('pcard').innerHTML =
  `<b>${pet.name}（${pet.type}）</b><br>
品种：${pet.breed}｜年龄：${pet.age}｜体重：${pet.weight}kg<br>
疫苗：${pet.vac1}｜狂犬：${pet.vac2}｜体内：${pet.de1}｜体外：${pet.de2}`;
}

// 生成报告
document.getElementById('makeR').onclick=()=>{
  let pet = getPet();
  let sym = document.getElementById('sym').value;
  let day = Array.from(sel.day||[])[0]||"";
  let t = pet.type;

  let r = `【${pet.name}｜${t}｜专业诊断报告】
——————————————
档案：${pet.breed} ${pet.age} ${pet.weight}kg
疫苗：${pet.vac1} 狂犬：${pet.vac2}
驱虫：体内${pet.de1} 体外${pet.de2}
主诉：${sym}
病程：${day}
——————————————
`;

  if(t=="狗"){
    if(/吐血|呕血/.test(sym)){
      r+=`【危症：吐血】
可能疾病：
1. 急性出血性胃肠炎
2. 胃溃疡/十二指肠溃疡出血
3. 食道/胃异物划伤
4. 中毒导致凝血障碍
5. 重症胰腺炎合并出血
6. 感染引发DIC休克

风险：极高危，12小时内可能脱水休克
建议：立即就医，禁水禁食，补液止血监护
`;
    }else if(/吐黄水|空腹吐/.test(sym)){
      r+=`【疑似：胆汁反流性胃炎】
病程：
• 1天内：急性饮食不当/空腹过久
• 2-3天：亚急性胃炎
• 一周以上：慢性胃炎，易反复
治疗：奥美拉唑+胃溃宁，少量多餐易消化食物
`;
    }
    if(/血便|拉血/.test(sym)){
      r+=`【危症：血便】
可能：细小病毒、冠状、出血性肠炎、球虫、钩虫、异物、胰腺炎
未疫苗幼犬优先考虑细小病毒
`;
    }
    if(/咳|干咳|湿咳|喘/.test(sym)){
      r+=`【呼吸道：犬窝咳/支气管炎/肺炎】
持续>7天易转为重症肺炎，未免疫犬需排查犬瘟
`;
    }
    if(/尿不出|尿闭/.test(sym)){
      r+=`【危症：尿道阻塞/结石/前列腺炎】
公犬24h可急性肾衰，必须立刻就医导尿
`;
    }
  }

  if(t=="猫"){
    if(/尿不出|尿闭/.test(sym)){
      r+=`【极高危：猫下泌尿道尿闭】
公猫最常见，数小时可致高钾、心衰、死亡
必须立刻急诊导尿
`;
    }
    if(/血尿|尿频/.test(sym)){
      r+=`【猫特发性膀胱炎/结晶/结石】
应激、缺水、肥胖为主要诱因
`;
    }
    if(/喷嚏|鼻涕|流泪/.test(sym)){
      r+=`【猫鼻支/疱疹/杯状/衣原体/支原体】
幼猫死亡率高，易反复发作
`;
    }
    if(/吐毛球|干呕/.test(sym)){
      r+=`【毛球症】
正常，喂化毛膏/猫草即可
`;
    }
    if(/血便/.test(sym)){
      r+=`【猫瘟/球虫/贾第虫/肠炎】
未疫苗猫高度怀疑猫瘟
`;
    }
  }

  if(r.trim().endsWith("——————————————")){
    r+="症状较轻，多为应激、消化不良、轻微肠炎\n建议：禁食6-12h，益生菌观察，加重就医";
  }

  r+="\n——————————————\n本报告仅供参考，不能替代兽医面诊";
  document.getElementById('report').innerHTML=r;
  document.getElementById('report').style.display='block';

  // 保存记录
  let rs = JSON.parse(localStorage.getItem(REC_KEY)||"[]");
  rs.unshift({name:pet.name,type:pet.type,t:new Date().toLocaleString(),text:r});
  if(rs.length>50) rs.pop();
  localStorage.setItem(REC_KEY, JSON.stringify(rs));
}

// 加载记录（可点开）
function loadHistory(){
  let rs = JSON.parse(localStorage.getItem(REC_KEY)||"[]");
  let box = document.getElementById('historyList');
  let detail = document.getElementById('detailView');
  if(rs.length===0){box.innerHTML="暂无诊疗记录";detail.style.display="none";return;}
  box.innerHTML = rs.map((x,i)=>`
    <div class="itemx" data-i="${i}">
      <h4>${x.name}（${x.type}）｜${x.t}</h4>
      <p>点击查看完整报告</p>
    </div>
  `).join('');
  box.querySelectorAll('.itemx').forEach(it=>{
    it.onclick=()=>{
      let i = it.dataset.i;
      detail.innerHTML = `<pre style="white-space:pre-line;font-size:13px;line-height:1.6;">${rs[i].text}</pre>`;
      detail.style.display="block";
    }
  })
}

// 疾病百科（可搜索·可点开）
const diseases = [
{name:"犬细小病毒",type:"狗",level:"烈性",info:`症状：剧烈呕吐、血便、脱水、高热、白细胞下降
治疗：禁水禁食、大量补液、抗病毒、止血、护胃、抗生素
预后：未免疫幼犬死亡率极高`},
{name:"犬瘟热",type:"狗",level:"烈性",info:`症状：双相热、眼屎、鼻涕、咳嗽、抽搐、神经症状
治疗：单抗、干扰素、补液、抗惊厥、营养支持
预后：出现神经症状预后极差`},
{name:"犬急性胰腺炎",type:"狗",level:"危重",info:`症状：剧烈呕吐、腹痛、弓背、发热、黄疸
治疗：禁食、强补液、止痛、抑酶、抗生素
禁忌：严禁喂油腻食物`},
{name:"猫瘟（猫泛白细胞减少症）",type:"猫",level:"烈性",info:`症状：高烧、呕吐、血便、脱水、白细胞极低
治疗：单抗、补液、止吐、止血、抗生素
预防：猫三联疫苗有效`},
{name:"猫下泌尿道尿闭",type:"猫",level:"极高危",info:`症状：频繁蹲猫砂盆、少尿/无尿、痛苦嚎叫、呕吐
治疗：立即导尿、输液、溶解结晶、止痛
预防：多水湿粮、减少应激`},
{name:"猫鼻支（疱疹病毒）",type:"猫",level:"高发病",info:`症状：喷嚏、流脓涕、眼泪、结膜炎、发热
治疗：赖氨酸、滴眼液、抗病毒、抗生素
特点：终身携带，应激易复发`},
{name:"犬猫细菌性胃肠炎",type:"通用",level:"常见",info:`症状：呕吐、拉稀、无血便、精神尚可
治疗：禁食、补液、益生菌、胃肠保护剂`},
{name:"犬猫真菌皮肤病",type:"通用",level:"常见",info:`症状：脱毛、圆形斑、皮屑、瘙痒
治疗：药浴、外用抗真菌、口服抗真菌
预防：环境消毒、干燥通风`}
];

function loadAllDisease(){
  let list = document.getElementById('dlist');
  list.innerHTML = diseases.map((d,i)=>`
    <div class="ditem" data-i="${i}">
      <h4>${d.name}（${d.type}｜${d.level}）</h4>
    </div>
  `).join('');
  list.querySelectorAll('.ditem').forEach(it=>{
    it.onclick=()=>{
      let i = it.dataset.i;
      document.getElementById('ddetail').innerHTML = `<pre style="white-space:pre-line;font-size:13px;line-height:1.6;">${diseases[i].info}</pre>`;
      document.getElementById('ddetail').style.display='block';
    }
  })
}

document.getElementById('searchD').oninput=e=>{
  let kw = e.target.value.toLowerCase();
  let list = document.getElementById('dlist');
  let arr = diseases.filter(d=>d.name.toLowerCase().includes(kw));
  list.innerHTML = arr.map((d,i)=>`<div class="ditem" data-i="${i}"><h4>${d.name}（${d.type}｜${d.level}）</h4></div>`).join('');
}
</script>
</body>
</html>
