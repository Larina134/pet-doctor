<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>猫狗全科诊疗系统（最终优化版）</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,Arial;}
  body{background:#fff5f8;padding:10px;}
  .wrap{max-width:900px;margin:0 auto;background:#fff;border-radius:16px;overflow:hidden;}
  .head{background:#ffb6c1;padding:16px;text-align:center;}
  .head h1{font-size:18px;color:#800033;}
  .nav{display:flex;background:#fff8fa;}
  .nav span{flex:1;padding:14px;text-align:center;font-size:14px;cursor:pointer;}
  .nav span.on{background:#fff;color:#a0003c;border-bottom:2px solid #e64980;font-weight:600;}
  .page{padding:18px;display:none;}
  .page.show{display:block;}
  .tit{font-size:16px;color:#a00033;margin:10px 0 12px;border-bottom:1px solid #ffc4d8;padding-bottom:8px;}
  .item{margin-bottom:12px;}
  .item label{display:block;font-size:13px;color:#70002c;margin-bottom:4px;}
  .item input,.item select,.item textarea{width:100%;padding:10px;border:1px solid #ffc4d8;border-radius:10px;background:#fff8fa;font-size:14px;}
  .btn{width:100%;padding:12px;background:#e64980;color:#fff;border:none;border-radius:10px;margin-top:6px;font-size:15px;cursor:pointer;}
  .btn2{background:#fff;color:#a0003c;border:1px solid #ffc4d8;}
  .btn3{background:#ff4444;color:#fff;border:none;}
  .card{padding:14px;background:#ffe7ef;border-radius:12px;margin-bottom:14px;font-size:13px;color:#70002c;}
  .qbox{padding:16px;background:#fff8fa;border-radius:12px;margin-top:14px;display:none;}
  .qitem{margin-bottom:14px;}
  .qitem .q{font-size:13px;color:#70002c;margin-bottom:6px;}
  .opts{display:flex;flex-wrap:wrap;gap:6px;}
  .opts span{padding:6px 10px;border:1px solid #ffc4d8;border-radius:8px;font-size:12px;cursor:pointer;}
  .opts span.sel{background:#e64980;color:#fff;}
  .report{margin-top:16px;padding:16px;background:#fff8fa;border-radius:12px;white-space:pre-line;line-height:1.6;font-size:13px;display:none;}
  .pet-list{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
  .pet-card{padding:12px;border:1px solid #ffc4d8;border-radius:10px;background:#fff8fa;cursor:pointer;position:relative;}
  .pet-card img{width:100%;height:90px;border-radius:8px;object-fit:cover;margin-bottom:6px;background:#ddd;}
  .pet-card h4{font-size:14px;color:#a00033;margin-bottom:4px;}
  .pet-card p{font-size:12px;color:#777;}
  .pet-card .del{position:absolute;top:6px;right:6px;background:#ff4444;color:#fff;font-size:12px;padding:2px 6px;border-radius:6px;cursor:pointer;}
  .his-item{padding:12px;border:1px solid #ffc4d8;border-radius:10px;background:#fff8fa;margin-bottom:8px;}
  .his-top{display:flex;justify-content:space-between;align-items:center;}
  .his-top h4{font-size:14px;color:#a00033;}
  .his-top button{padding:4px 8px;font-size:12px;background:#ff4444;color:#fff;border:none;border-radius:6px;cursor:pointer;}
  .his-body{margin-top:8px;padding:10px;background:#fff;border-radius:8px;white-space:pre-line;font-size:12px;line-height:1.5;display:none;}
  .d-item{padding:10px;border-bottom:1px solid #f0f0f0;cursor:pointer;}
  .d-item h4{font-size:14px;color:#a00033;}
  .d-body{padding:10px;background:#fff8fa;border-radius:8px;margin-top:6px;font-size:12px;line-height:1.5;white-space:pre-line;display:none;}
  .search{padding:12px;border:1px solid #ffc4d8;border-radius:10px;width:100%;margin-bottom:12px;}
  .d-list{max-height:360px;overflow:auto;}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><h1>猫狗全科诊疗系统（最终优化版）</h1></div>
  <div class="nav">
    <span class="on" data-p="1">宠物档案管理</span>
    <span data-p="2">症状诊断</span>
    <span data-p="3">诊疗记录</span>
    <span data-p="4">疾病百科全书</span>
  </div>

  <!-- 1 多宠物档案管理 -->
  <div class="page show" id="p1">
    <div class="tit">新增/修改宠物档案</div>
    <input type="hidden" id="editId">
    <div class="item"><label>主人姓名</label><input id="owner"></div>
    <div class="item"><label>宠物名字</label><input id="pname"></div>
    <div class="item"><label>种类</label><select id="ptype"><option>狗</option><option>猫</option></select></div>
    <div class="item"><label>品种</label><input id="pbreed"></div>
    <div class="item"><label>年龄</label><input id="page"></div>
    <div class="item"><label>体重(kg)</label><input id="pweight"></div>
    <div class="item"><label>性别</label><select id="pgender"><option>公</option><option>母</option></select></div>
    <div class="item"><label>宠物照片（可选）</label><input type="file" id="avatar" accept="image/*"></div>

    <div class="tit">疫苗</div>
    <div class="item"><label>核心疫苗</label><select id="vac1"><option>未接种</option><option>1针</option><option>2针</option><option>3针全套</option><option>已加强</option></select></div>
    <div class="item"><label>狂犬疫苗</label><select id="vac2"><option>未接种</option><option>已接种</option><option>过期</option></select></div>

    <div class="tit">驱虫</div>
    <div class="item"><label>体内驱虫</label><select id="de1"><option>未做</option><option>1月内</option><option>3月内</option><option>半年以上</option></select></div>
    <div class="item"><label>体外驱虫</label><select id="de2"><option>未做</option><option>1月内</option><option>3月内</option></select></div>

    <button class="btn" id="savePet">保存档案并前往诊断</button>
    <button class="btn btn2" id="resetForm">清空重新填写</button>

    <div class="tit" style="margin-top:16px;">已保存宠物列表（点击使用）</div>
    <div class="pet-list" id="petList"></div>
  </div>

  <!-- 2 症状诊断 -->
  <div class="page" id="p2">
    <div class="card" id="usePet"></div>
    <div class="tit">主人描述症状</div>
    <div class="item"><textarea id="sym" placeholder="呕吐、拉稀、咳嗽、吐血、拉血、抽搐、不吃饭、尿不出..."></textarea></div>
    <button class="btn" id="startQ">开始问诊</button>

    <div class="qbox" id="qbox">
      <div class="qitem">
        <div class="q">病程时间</div>
        <div class="opts" data-key="day">
          <span>1天内</span><span>2-3天</span><span>4-7天</span><span>1-2周</span><span>2周以上</span>
        </div>
      </div>
      <div class="qitem">
        <div class="q">病况补充（可多选）</div>
        <div class="opts" data-key="add">
          <span>发烧</span><span>不吃饭</span><span>不喝水</span><span>嗜睡</span><span>腹痛弓背</span>
          <span>发抖</span><span>口臭</span><span>眼屎多</span><span>流鼻涕</span><span>瘙痒</span>
          <span>消瘦</span><span>腹水肚大</span><span>黄疸</span><span>尿频</span><span>尿血</span>
        </div>
      </div>
    </div>

    <button class="btn" id="makeR" style="display:none;margin-top:10px">生成诊断报告</button>
    <div class="report" id="report"></div>
  </div>

  <!-- 3 诊疗记录（可删、点开在下方） -->
  <div class="page" id="p3">
    <div class="tit">诊疗记录（点击展开详情）</div>
    <div id="hisList"></div>
  </div>

  <!-- 4 疾病百科（点开在下方） -->
  <div class="page" id="p4">
    <div class="tit">疾病百科全书</div>
    <input class="search" id="searchD" placeholder="搜索疾病：细小、尿闭、猫瘟、胰腺炎...">
    <div class="d-list" id="dList"></div>
  </div>
</div>

<script>
// 导航
document.querySelectorAll('.nav span').forEach(n=>{
  n.onclick=()=>{
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('show'));
    document.querySelectorAll('.nav span').forEach(s=>s.classList.remove('on'));
    n.classList.add('on');
    document.getElementById('p'+n.dataset.p).classList.add('show');
    if(n.dataset.p==1) loadPetList();
    if(n.dataset.p==3) loadHis();
    if(n.dataset.p==4) loadDisease();
  }
})

// 存储 KEY
const PETS = "pet_list_data";
const HIS = "pet_his_data";

// 清空表单
document.getElementById('resetForm').onclick=()=>{
  document.getElementById('editId').value='';
  document.getElementById('owner').value='';
  document.getElementById('pname').value='';
  document.getElementById('pbreed').value='';
  document.getElementById('page').value='';
  document.getElementById('pweight').value='';
  document.getElementById('avatar').value='';
}

// 保存档案 → 自动跳诊断
document.getElementById('savePet').onclick=async ()=>{
  let id = document.getElementById('editId').value || Date.now();
  let name = document.getElementById('pname').value;
  if(!name){alert("请填写宠物名");return;}

  let file = document.getElementById('avatar').files[0];
  let avatar = "";
  if(file){
    avatar = await new Promise(r=>{
      let fr = new FileReader();
      fr.onload=()=>r(fr.result);
      fr.readAsDataURL(file);
    })
  }

  let item = {
    id, owner:document.getElementById('owner').value, name,
    type:document.getElementById('ptype').value,
    breed:document.getElementById('pbreed').value,
    age:document.getElementById('page').value,
    weight:document.getElementById('pweight').value,
    gender:document.getElementById('pgender').value,
    vac1:document.getElementById('vac1').value,
    vac2:document.getElementById('vac2').value,
    de1:document.getElementById('de1').value,
    de2:document.getElementById('de2').value,
    avatar
  };

  let list = JSON.parse(localStorage.getItem(PETS)||"[]");
  let idx = list.findIndex(x=>x.id==id);
  if(idx>-1) list[idx]=item; else list.unshift(item);
  localStorage.setItem(PETS, JSON.stringify(list));

  sessionStorage.setItem('usePet', JSON.stringify(item));
  alert("保存成功，即将进入诊断");
  document.querySelector('[data-p="2"]').click();
}

// 加载宠物列表
function loadPetList(){
  let list = JSON.parse(localStorage.getItem(PETS)||"[]");
  let box = document.getElementById('petList');
  box.innerHTML = list.map(p=>`
    <div class="pet-card">
      <div class="del" data-id="${p.id}">删除</div>
      ${p.avatar?`<img src="${p.avatar}">`:''}
      <h4>${p.name}（${p.type}）</h4>
      <p>${p.breed}｜${p.age}｜${p.weight}kg</p>
    </div>
  `).join('');

  box.querySelectorAll('.del').forEach(d=>{
    d.onclick=(e)=>{
      e.stopPropagation();
      if(!confirm("删除该宠物？"))return;
      let id = d.dataset.id;
      let arr = JSON.parse(localStorage.getItem(PETS)||"[]");
      arr = arr.filter(x=>x.id!=id);
      localStorage.setItem(PETS, JSON.stringify(arr));
      loadPetList();
    }
  })
  box.querySelectorAll('.pet-card').forEach(c=>{
    c.onclick=()=>{
      let id = c.querySelector('.del').dataset.id;
      let p = JSON.parse(localStorage.getItem(PETS)||"[]").find(x=>x.id==id);
      sessionStorage.setItem('usePet', JSON.stringify(p));
      document.querySelector('[data-p="2"]').click();
    }
  })
}

// 进入诊断页自动加载宠物
function showUsePet(){
  let p = sessionStorage.getItem('usePet');
  if(!p){document.getElementById('usePet').innerHTML="<b>请先在档案页选择宠物</b>";return;}
  p = JSON.parse(p);
  document.getElementById('usePet').innerHTML = `
<b>当前使用：${p.name}（${p.type}）</b><br>
品种：${p.breed}｜年龄：${p.age}｜体重：${p.weight}kg<br>
疫苗：${p.vac1}｜狂犬：${p.vac2}｜体内：${p.de1}｜体外：${p.de2}
  `;
}

// 选项
let sel = {};
document.querySelectorAll('.opts').forEach(g=>{
  g.querySelectorAll('span').forEach(s=>{
    s.onclick=()=>{
      s.classList.toggle('sel');
      let k = g.dataset.key;
      if(!sel[k]) sel[k]=new Set();
      sel[k].has(s.innerText) ? sel[k].delete(s.innerText) : sel[k].add(s.innerText);
    }
  })
})

// 开始问诊
document.getElementById('startQ').onclick=()=>{
  if(!sessionStorage.getItem('usePet')){alert("请先选宠物");return;}
  if(!document.getElementById('sym').value){alert("请输入症状");return;}
  document.getElementById('qbox').style.display='block';
  document.getElementById('makeR').style.display='block';
  showUsePet();
}

// 生成报告
document.getElementById('makeR').onclick=()=>{
  let pet = JSON.parse(sessionStorage.getItem('usePet'));
  let sym = document.getElementById('sym').value;
  let day = Array.from(sel.day||[]).join(' ') || "未选择";
  let add = Array.from(sel.add||[]).join(' ') || "无补充";

  let r = `【${pet.name}｜${pet.type}｜诊断报告】
——————————————
档案：${pet.breed} ${pet.age} ${pet.weight}kg
疫苗：${pet.vac1} 狂犬：${pet.vac2}
驱虫：体内${pet.de1} 体外${pet.de2}
主诉：${sym}
病程：${day}
补充：${add}
——————————————
`;

// 以下为你原有疾病匹配逻辑，完整保留
if(pet.type=="狗"){
if(/细小|血便|腥臭|呕吐/.test(sym))r+=`【犬细小病毒】\n剧烈呕吐、腥臭血便、脱水、幼犬高危\n`;
if(/犬瘟|眼屎|抽搐|脚垫/.test(sym))r+=`【犬瘟热】\n高烧、眼屎、咳嗽、脚垫硬、后期抽搐\n`;
if(/冠状|呕吐|拉稀/.test(sym))r+=`【犬冠状病毒】\n呕吐、拉稀、精神差\n`;
if(/钩端|黄疸|尿血/.test(sym))r+=`【钩端螺旋体】\n发烧、黄疸、肝肾损伤、尿血\n`;
if(/胰腺炎|弓背|油腻/.test(sym))r+=`【急性胰腺炎】\n腹痛、呕吐、不吃、急症禁食\n`;
if(/胃扭转|胀肚|干呕/.test(sym))r+=`【胃扭转】\n大型犬致命，立即手术\n`;
if(/尿闭|尿不出/.test(sym))r+=`【尿道阻塞】\n立即就医\n`;
if(/子宫蓄脓|流脓/.test(sym))r+=`【子宫蓄脓】\n必须手术\n`;
if(/髌骨|跳着走/.test(sym))r+=`【髌骨脱位】\n小型犬高发\n`;
if(/椎间盘|无力/.test(sym))r+=`【椎间盘突出】\n疼痛、后肢无力\n`;
}
if(pet.type=="猫"){
if(/猫瘟|白细胞|便血/.test(sym))r+=`【猫瘟】\n高烧、呕吐、便血、白细胞下降\n`;
if(/鼻支|喷嚏|眼睛/.test(sym))r+=`【猫鼻支】\n喷嚏、流涕、眼红肿\n`;
if(/杯状|口炎|跛行/.test(sym))r+=`【猫杯状病毒】\n口炎、流口水、跛行\n`;
if(/传腹|腹水|发烧/.test(sym))r+=`【猫传腹】\n腹水、发烧、消瘦、黄疸\n`;
if(/尿闭|尿不出|惨叫/.test(sym))r+=`【猫尿闭】\n公猫高危，24h肾衰，立即就医\n`;
if(/膀胱炎|尿血/.test(sym))r+=`【猫膀胱炎/结石】\n尿频、尿血\n`;
if(/口炎|溃烂/.test(sym))r+=`【猫口炎】\n剧痛、拒食、流口水\n`;
if(/肾衰|多饮多尿/.test(sym))r+=`【慢性肾衰】\n老年猫高发\n`;
if(/应激|不吃饭/.test(sym))r+=`【猫应激】\n可诱发传腹、膀胱炎、脂肪肝\n`;
}
if(/中毒|抽搐|百合|木糖醇/.test(sym))r+=`【中毒】\n立即催吐送医\n`;
if(/肺炎|喘|腹式呼吸/.test(sym))r+=`【肺炎】\n高热、咳喘、危险\n`;
if(/犬窝咳|咳嗽|干呕/.test(sym))r+=`【犬窝咳】\n强传染\n`;

if(r.trim().endsWith("——————————————"))r+="症状较轻：消化不良/着凉/应激，观察24h，益生菌调理";
r+="\n——————————————\n仅供参考，不能替代兽医面诊";

document.getElementById('report').innerHTML=r;
document.getElementById('report').style.display='block';

let hs = JSON.parse(localStorage.getItem(HIS)||"[]");
hs.unshift({id:Date.now(),name:pet.name,type:pet.type,t:new Date().toLocaleString(),text:r});
localStorage.setItem(HIS,JSON.stringify(hs));
}

// 诊疗记录（可删、展开在本条下方）
function loadHis(){
  let hs = JSON.parse(localStorage.getItem(HIS)||"[]");
  let box = document.getElementById('hisList');
  if(hs.length===0){box.innerHTML="<div style=padding:10px>暂无记录</div>";return;}
  box.innerHTML = hs.map(h=>`
    <div class="his-item">
      <div class="his-top">
        <h4>${h.name}（${h.type}）｜${h.t}</h4>
        <button class="delHis" data-id="${h.id}">删除</button>
      </div>
      <div class="his-body">${h.text}</div>
    </div>
  `).join('');

  box.querySelectorAll('.delHis').forEach(b=>{
    b.onclick=()=>{
      if(!confirm("删除该记录？"))return;
      let arr = JSON.parse(localStorage.getItem(HIS)||"[]");
      arr = arr.filter(x=>x.id!=b.dataset.id);
      localStorage.setItem(HIS,JSON.stringify(arr));
      loadHis();
    }
  })
  box.querySelectorAll('.his-top').forEach(t=>{
    t.onclick=()=>{
      let body = t.nextElementSibling;
      body.style.display = body.style.display=="none"?"block":"none";
    }
  })
}

// 疾病百科（展开在当前疾病下方）
const diseases = [
{name:"犬细小病毒",info:`症状：剧烈呕吐、拉稀（腥臭味血便）、脱水、没精神\n高发：幼犬、未疫苗、接触病犬\n处理：立刻就医，禁水禁食`},
{name:"犬瘟热",info:`症状：高烧、眼屎多、咳嗽、脚垫变硬、抽搐\n高发：幼犬、流浪犬、群居\n处理：极高致死率`},
{name:"犬冠状病毒",info:`呕吐、拉稀、精神差，易与细小混淆`},
{name:"钩端螺旋体",info:`发烧、黄疸、肝肾损伤、尿血，污水高发`},
{name:"猫瘟",info:`高烧、呕吐、便血、白细胞骤降，幼猫高危`},
{name:"猫鼻支",info:`喷嚏、流涕、眼红肿、食欲差`},
{name:"猫杯状病毒",info:`口炎、流口水、喷嚏、跛行`},
{name:"猫传腹",info:`腹水、发烧、消瘦、黄疸、贫血`},
{name:"猫尿闭",info:`公猫高危，尿不出、惨叫，24h肾衰死亡`},
{name:"急性胰腺炎",info:`弓背腹痛、呕吐、不吃，油腻诱发，急症`},
{name:"真菌皮肤病",info:`圆形掉毛、皮屑、瘙痒，可传染人`},
{name:"犬窝咳",info:`强传染，空洞咳嗽、干呕`},
{name:"猫应激",info:`诱发传腹、膀胱炎、脂肪肝、猝死`},
{name:"中毒",info:`狗：巧克力/葡萄/木糖醇；猫：百合致命，立即催吐送医`}
];

function loadDisease(){
  let box = document.getElementById('dList');
  box.innerHTML = diseases.map((d,i)=>`
    <div class="d-item">
      <h4>${d.name}</h4>
      <div class="d-body">${d.info}</div>
    </div>
  `).join('');
  box.querySelectorAll('.d-item').forEach(it=>{
    it.onclick=()=>{
      let b = it.querySelector('.d-body');
      b.style.display = b.style.display=="none"?"block":"none";
    }
  })
}

document.getElementById('searchD').oninput=e=>{
  let kw = e.target.value.toLowerCase();
  let arr = diseases.filter(d=>d.name.toLowerCase().includes(kw)||d.info.toLowerCase().includes(kw));
  document.getElementById('dList').innerHTML = arr.map((d,i)=>`
    <div class="d-item"><h4>${d.name}</h4><div class="d-body">${d.info}</div></div>
  `).join('');
}

// 初始加载
loadPetList();
